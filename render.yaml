services:
  - type: web
    name: azret-manage-plan
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: AI_LOCAL_FALLBACK
        value: "0"
